name: Predictive forward outcome audit - NO ORDERS
on:
  schedule:
    # After regular NY close + 16-minute SIP delay in both DST seasons.
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
    inputs:
      validate_only:
        description: Validate environment only, without claiming forward evidence
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: predictive-forward-outcome-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-prospective.txt
      - run: pip install -r requirements-prospective.txt
      - name: Verify frozen forward evidence and cumulative outcomes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          PROSPECTIVE_EVIDENCE_KEY: ${{ secrets.PROSPECTIVE_EVIDENCE_KEY }}
        run: |
          python -c "from prospective_cloud_runner import validate; validate()"
          if [ '${{ inputs.validate_only }}' = 'true' ]; then
            python prospective_audit_runner.py --validate-only
          else
            python prospective_audit_runner.py
          fi
      - name: Retain audit report only - no decrypted input archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prospective-outcome-audit-${{ github.run_id }}
          path: research_runs/prospective_automatic_audit/*.json
          if-no-files-found: warn
          retention-days: 90
