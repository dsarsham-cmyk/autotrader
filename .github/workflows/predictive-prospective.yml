name: Predictive research control - NO ORDERS

on:
  schedule:
    # Summer/winter alternatives; NY-time guard runs exactly one eligible job.
    # Prepare early because GitHub schedules can be delayed; never backfill.
    - cron: '57 13,14 * * 1-5'
  workflow_dispatch:
    inputs:
      validate_only:
        description: Validate frozen environment without collecting forecasts
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: predictive-prospective-control
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep this experiment fixed even while other research code evolves.
          ref: 1365f9a6efa87210fd9b3e053d4195f191ebc178
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-prospective.txt
      - name: Check prospective preparation window
        id: plan
        run: python prospective_cloud_runner.py plan
      - name: Install isolated research dependencies
        if: steps.plan.outputs.run == 'true' || inputs.validate_only == true
        run: pip install -r requirements-prospective.txt
      - name: Checkout encryption helper separately from frozen forecast code
        if: steps.plan.outputs.run == 'true' || inputs.validate_only == true
        uses: actions/checkout@v4
        with:
          path: evidence-tools
      - name: Validate dedicated evidence key
        if: steps.plan.outputs.run == 'true' || inputs.validate_only == true
        env:
          PROSPECTIVE_EVIDENCE_KEY: ${{ secrets.PROSPECTIVE_EVIDENCE_KEY }}
        run: python evidence-tools/research_evidence_crypto.py validate
      - name: Validate only - not a trading test
        if: inputs.validate_only == true
        run: python prospective_cloud_runner.py validate
      - name: Collect prospective forecast - data GET only
        if: steps.plan.outputs.run == 'true' && inputs.validate_only != true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: python prospective_cloud_runner.py collect
      - name: Timestamp forecast and status externally
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prospective-forecast-${{ github.run_id }}
          path: |
            research_prospective/control_v2/predictions/*.json
            research_runs/cloud_status.json
          if-no-files-found: warn
          retention-days: 90
      - name: Encrypt private data after forecast timestamping
        if: always() && steps.plan.outputs.run == 'true' && inputs.validate_only != true
        env:
          PROSPECTIVE_EVIDENCE_KEY: ${{ secrets.PROSPECTIVE_EVIDENCE_KEY }}
        run: python evidence-tools/research_evidence_crypto.py seal
      - name: Retain encrypted private data evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prospective-private-encrypted-${{ github.run_id }}
          path: research_runs/private_evidence.aesgcm
          if-no-files-found: ignore
          retention-days: 90
