name: LOW RISK
status_interval_seconds: 900
mode: alpaca_paper
market: stock
stock:
  symbols:
  - QQQ
  - SPY
  - DIA
  - IWM
  - EWJ
  - EZU
  - EWU
  - EWG
  timeframe: 1d
strategy:
  name: volatility_scaled_momentum
  lookback: 126
  vol_period: 20
  vol_baseline: 252
  vol_mult: 1.5
risk:
  risk_per_trade: 0.0025
  atr_stop_mult: 2.0
  atr_take_mult: 3.0
  max_position_pct: 0.12
  daily_loss_limit_pct: 0.02
  max_drawdown_pct: 0.10
  starting_equity: 100000
  max_account_loss_pct: 0.10
  break_even_atr: 1.0
  trail_atr: 2.0
  trail_distance_atr: 1.0
  capital_fraction: 0.5
day_trading:
  close_at_eod: false
  eod_close_time: '22:55'
data:
  fetch_limit: 500
paper:
  starting_balance: 100000
  fee_pct: 0.001
loop:
  interval_seconds: 60
alerts:
  enabled: true
logging:
  level: INFO
  file: logs/trader_low.log
  logbook: logs/logbook_low.csv
state_file: state_low.json
